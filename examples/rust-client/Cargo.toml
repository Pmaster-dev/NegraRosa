[package]
name = "negrarosa-rust-client"
version = "1.0.0"
edition = "2021"
description = "High-assurance Rust SDK for NegraRosa zero-trust enclave attestation, DIDs, and neural-unit verification"

[dependencies]
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
