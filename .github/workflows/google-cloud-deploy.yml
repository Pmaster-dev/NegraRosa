name: Google Cloud Keyless OIDC Deployment

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write # Required for requesting the JWT from GitHub OIDC provider
  contents: read

jobs:
  deploy-to-google-cloud:
    name: Deploy to Cloud Run with Workload Identity Federation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Keyless authentication into Google Cloud: No static service account keys!
      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: 'negrarosa-security-2026'
          workload_identity_provider: 'projects/408361840279/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@negrarosa-security-2026.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Authentication State
        run: |
          gcloud auth list
          gcloud config set project negrarosa-security-2026

      - name: Build & Deploy Container
        run: |
          echo "Deploying verified commit ${{ github.sha }} to Google Cloud Run Enclave..."
